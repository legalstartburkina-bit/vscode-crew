name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  powershell:
    name: PowerShell scripts and installation tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pester
        shell: pwsh
        run: Install-Module Pester -Scope CurrentUser -Force -SkipPublisherCheck
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $errors = @()
          Get-ChildItem -Path . -Filter *.ps1 -Recurse | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) { $errors += "$($_.FullName): $parseErrors" }
          }
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
      - name: Run Pester tests
        shell: pwsh
        run: Invoke-Pester -Path ./tests -Output Detailed

  documents:
    name: Validate JSON and referenced files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON
        run: python -m json.tool deepseek.chatLanguageModels.example.json >/dev/null
      - name: Check documented DeepSeek template
        run: test -f deepseek.chatLanguageModels.example.json
